name: Pacifica
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
options:
  bundleIdPrefix: com.pacifica
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Pacifica:
    type: application
    platform: iOS
    sources: [Pacifica]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacifica.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Pacifica uses the camera for your optional daily selfie.
        TARGETED_DEVICE_FAMILY: "1"
