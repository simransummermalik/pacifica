name: Pacifica
options:
  bundleIdPrefix: com.pacifica
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Pacifica:
    type: application
    platform: iOS
    sources: [Pacifica]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacifica.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
